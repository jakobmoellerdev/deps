version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  GOLANGCI_LINT_VERSION: 2.15.0
  # Pinned copy installed by lint:install when no matching golangci-lint is on PATH.
  GOLANGCI_LINT_BIN:
    sh: echo "${TMPDIR:-/tmp}/deps-tools/golangci-lint-{{.GOLANGCI_LINT_VERSION}}"
  GOLANGCI_LINT:
    sh: |
      if command -v golangci-lint >/dev/null && [ "$(golangci-lint version --short 2>/dev/null)" = "{{.GOLANGCI_LINT_VERSION}}" ]; then
        command -v golangci-lint
      else
        echo "${TMPDIR:-/tmp}/deps-tools/golangci-lint-{{.GOLANGCI_LINT_VERSION}}"
      fi

tasks:
  default:
    desc: Run the CI checks
    cmds:
      - task: ci

  ci:
    desc: Everything CI runs (vet, lint, race tests, coverage gate, formatting, tidy check)
    cmds:
      - task: vet
      - task: lint
      - task: cover
      - task: fmt:check
      - task: tidy:check

  lint:
    desc: Run golangci-lint (installs v{{.GOLANGCI_LINT_VERSION}} into $TMPDIR/deps-tools if missing)
    deps: [lint:install]
    cmds:
      - "{{.GOLANGCI_LINT}} run {{.CLI_ARGS}}"

  lint:fix:
    desc: Run golangci-lint with --fix
    deps: [lint:install]
    cmds:
      - "{{.GOLANGCI_LINT}} run --fix"

  lint:install:
    desc: Download and checksum-verify golangci-lint v{{.GOLANGCI_LINT_VERSION}} unless present
    status:
      - test -x "{{.GOLANGCI_LINT}}"
    cmds:
      - |
        set -eu
        name="golangci-lint-{{.GOLANGCI_LINT_VERSION}}-$(go env GOOS)-$(go env GOARCH)"
        base="https://github.com/golangci/golangci-lint/releases/download/v{{.GOLANGCI_LINT_VERSION}}"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -sSfL -o "$tmp/$name.tar.gz" "$base/$name.tar.gz"
        curl -sSfL -o "$tmp/checksums.txt" "$base/golangci-lint-{{.GOLANGCI_LINT_VERSION}}-checksums.txt"
        (cd "$tmp" && grep "  $name.tar.gz\$" checksums.txt | sha256sum -c --quiet -)
        tar -xzf "$tmp/$name.tar.gz" -C "$tmp"
        mkdir -p "$(dirname "{{.GOLANGCI_LINT_BIN}}")"
        mv "$tmp/$name/golangci-lint" "{{.GOLANGCI_LINT_BIN}}"
        echo "installed {{.GOLANGCI_LINT_BIN}}"

  build:
    desc: Build bin/deps (static, no cgo, trimmed)
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/deps ./cmd/deps

  release:build:
    desc: Build static linux/amd64 and linux/arm64 release binaries and checksums into dist/
    env:
      CGO_ENABLED: "0"
    cmds:
      - rm -rf dist && mkdir -p dist
      - for: [amd64, arm64]
        cmd: GOOS=linux GOARCH={{.ITEM}} go build -trimpath -ldflags "-s -w -buildid= -X main.version={{.VERSION}}" -o dist/deps_linux_{{.ITEM}} ./cmd/deps
      - cd dist && sha256sum deps_linux_amd64 deps_linux_arm64 > checksums.txt

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  cover:
    desc: Run race tests with coverage; fail below {{.MIN_COVERAGE}}%
    vars:
      MIN_COVERAGE: 90
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - |
        total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
        echo "total coverage: ${total}%"
        awk -v t="$total" 'BEGIN { exit !(t >= {{.MIN_COVERAGE}}) }' || { echo "coverage below {{.MIN_COVERAGE}}%"; exit 1; }

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  tidy:check:
    desc: Fail if go.mod/go.sum are not tidy
    cmds:
      - go mod tidy -diff

  plan:
    desc: Show the updates deps would make to this repo
    deps: [build]
    cmds:
      - bin/deps plan -v

  dry-run:
    desc: Show the PRs deps would create for this repo
    deps: [build]
    cmds:
      - bin/deps run --dry-run -v
