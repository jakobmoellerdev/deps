version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  GOLANGCI_LINT_VERSION: 2.15.0
  # Pinned copy installed by lint:install when no matching golangci-lint is on PATH.
  GOLANGCI_LINT_BIN:
    sh: echo "${TMPDIR:-/tmp}/deps-tools/golangci-lint-{{.GOLANGCI_LINT_VERSION}}"
  GOLANGCI_LINT:
    sh: |
      if command -v golangci-lint >/dev/null && [ "$(golangci-lint version --short 2>/dev/null)" = "{{.GOLANGCI_LINT_VERSION}}" ]; then
        command -v golangci-lint
      else
        echo "${TMPDIR:-/tmp}/deps-tools/golangci-lint-{{.GOLANGCI_LINT_VERSION}}"
      fi
  GIT_CLIFF_VERSION: 2.14.2
  # Pinned git-cliff (release notes / CHANGELOG.md), installed by changelog:install unless the
  # same version is on PATH.
  GIT_CLIFF:
    sh: |
      if command -v git-cliff >/dev/null && [ "$(git-cliff --version 2>/dev/null)" = "git-cliff {{.GIT_CLIFF_VERSION}}" ]; then
        command -v git-cliff
      else
        echo "${TMPDIR:-/tmp}/deps-tools/git-cliff-{{.GIT_CLIFF_VERSION}}/git-cliff"
      fi
  NFPM_VERSION: 2.48.0
  # Pinned nfpm (Arch Linux and Alpine packages), installed by nfpm:install unless the same
  # version is on PATH.
  NFPM:
    sh: |
      if command -v nfpm >/dev/null && nfpm --version 2>/dev/null | grep -Eq '^GitVersion: +v?{{.NFPM_VERSION}}$'; then
        command -v nfpm
      else
        echo "${TMPDIR:-/tmp}/deps-tools/nfpm-{{.NFPM_VERSION}}/nfpm"
      fi
  SYFT_VERSION: 1.56.0
  # Pinned syft (SBOMs of the release binaries), installed by syft:install unless the same version
  # is on PATH.
  SYFT:
    sh: |
      if command -v syft >/dev/null && [ "$(syft version 2>/dev/null | awk '$1 == "Version:" {print $2}')" = "{{.SYFT_VERSION}}" ]; then
        command -v syft
      else
        echo "${TMPDIR:-/tmp}/deps-tools/syft-{{.SYFT_VERSION}}/syft"
      fi
  COSIGN_VERSION: 3.1.4
  # Pinned cosign (verifies the GitHub attestations before they are attached to the Gitea
  # release), installed by cosign:install unless the same version is on PATH.
  COSIGN:
    sh: |
      if command -v cosign >/dev/null && cosign version 2>/dev/null | grep -Eq '^GitVersion: +v{{.COSIGN_VERSION}}$'; then
        command -v cosign
      else
        echo "${TMPDIR:-/tmp}/deps-tools/cosign-{{.COSIGN_VERSION}}/cosign"
      fi

tasks:
  default:
    desc: Run the CI checks
    cmds:
      - task: ci

  ci:
    desc: Everything CI runs (check, then race tests with the coverage gate)
    cmds:
      - task: check
      - task: cover

  check:
    desc: Static checks (golangci-lint, whose govet covers go vet, gofmt, tidy check, generated docs check); CI runs them beside cover
    cmds:
      - task: lint
      - task: fmt:check
      - task: tidy:check
      - task: docs:check

  docs:
    desc: Regenerate docs/reference/*.md and deps.schema.json from the schema, the command tree, action.yml and the managers
    cmds:
      - go run ./cmd/deps docs --out docs/reference --schema deps.schema.json --action action.yml

  replacements:update:
    desc: Refresh internal/config/renovate-replacements.json from Renovate's main branch and regenerate the built-in replacements
    cmds:
      - curl -fsSL https://raw.githubusercontent.com/renovatebot/renovate/main/lib/data/replacements.json -o internal/config/renovate-replacements.json
      - go generate ./internal/config

  docs:check:
    desc: Fail if docs/reference or deps.schema.json differ from what `task docs` generates
    cmds:
      - |
        set -eu
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        go run ./cmd/deps docs --out "$tmp/reference" --schema "$tmp/deps.schema.json" --action action.yml
        if ! diff -ru docs/reference "$tmp/reference" || ! diff -u deps.schema.json "$tmp/deps.schema.json"; then
          echo "generated documentation is stale; run 'task docs' and commit the result" >&2
          exit 1
        fi

  lint:
    desc: Run golangci-lint (installs v{{.GOLANGCI_LINT_VERSION}} into $TMPDIR/deps-tools if missing)
    deps: [lint:install]
    cmds:
      - "{{.GOLANGCI_LINT}} run {{.CLI_ARGS}}"

  lint:fix:
    desc: Run golangci-lint with --fix
    deps: [lint:install]
    cmds:
      - "{{.GOLANGCI_LINT}} run --fix"

  lint:install:
    desc: Download and checksum-verify golangci-lint v{{.GOLANGCI_LINT_VERSION}} unless present
    status:
      - test -x "{{.GOLANGCI_LINT}}"
    cmds:
      - |
        set -eu
        name="golangci-lint-{{.GOLANGCI_LINT_VERSION}}-$(go env GOOS)-$(go env GOARCH)"
        base="https://github.com/golangci/golangci-lint/releases/download/v{{.GOLANGCI_LINT_VERSION}}"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -sSfL -o "$tmp/$name.tar.gz" "$base/$name.tar.gz"
        curl -sSfL -o "$tmp/checksums.txt" "$base/golangci-lint-{{.GOLANGCI_LINT_VERSION}}-checksums.txt"
        (cd "$tmp" && grep "  $name.tar.gz\$" checksums.txt | sha256sum -c --quiet -)
        tar -xzf "$tmp/$name.tar.gz" -C "$tmp"
        mkdir -p "$(dirname "{{.GOLANGCI_LINT_BIN}}")"
        mv "$tmp/$name/golangci-lint" "{{.GOLANGCI_LINT_BIN}}"
        echo "installed {{.GOLANGCI_LINT_BIN}}"

  changelog:install:
    desc: Download and checksum-verify git-cliff v{{.GIT_CLIFF_VERSION}} unless present
    status:
      - test -x "{{.GIT_CLIFF}}"
    cmds:
      - |
        set -eu
        case "$(uname -m)" in
          x86_64|amd64) arch=x86_64; sum=26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a ;;
          aarch64|arm64) arch=aarch64; sum=fd27768ea76fea8c3ba3f3247fef2f6604988b629f15e48bf40be5eaa08b8fef2e4087cc9c8af16bc522bc19cc369611fa7692101b513f63469ad58522708600 ;;
          *) echo "git-cliff: unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        name="git-cliff-{{.GIT_CLIFF_VERSION}}-$arch-unknown-linux-gnu.tar.gz"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -sSfL -o "$tmp/$name" "https://github.com/orhun/git-cliff/releases/download/v{{.GIT_CLIFF_VERSION}}/$name"
        echo "$sum  $tmp/$name" | sha512sum -c --quiet -
        dest="${TMPDIR:-/tmp}/deps-tools"
        mkdir -p "$dest"
        tar -xzf "$tmp/$name" -C "$dest"
        echo "installed $dest/git-cliff-{{.GIT_CLIFF_VERSION}}/git-cliff"

  changelog:
    desc: Regenerate CHANGELOG.md (pass `-- --tag vX.Y.Z` to name the unreleased section before tagging)
    deps: [changelog:install]
    cmds:
      - "{{.GIT_CLIFF}} --output CHANGELOG.md {{.CLI_ARGS}}"

  release:notes:
    desc: Write the release notes of the current tag to dist/RELEASE_NOTES.md
    deps: [changelog:install]
    cmds:
      - mkdir -p dist
      - "{{.GIT_CLIFF}} --latest --strip header --output dist/RELEASE_NOTES.md"

  build:
    desc: Build bin/deps (static, no cgo, trimmed)
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/deps ./cmd/deps

  release:build:
    desc: Build static release binaries for linux, darwin and windows (amd64, arm64) and checksums into dist/
    env:
      CGO_ENABLED: "0"
    cmds:
      - rm -rf dist && mkdir -p dist
      - for:
          matrix:
            OS: [linux, darwin, windows]
            ARCH: [amd64, arm64]
        cmd: GOOS={{.ITEM.OS}} GOARCH={{.ITEM.ARCH}} go build -trimpath -ldflags "-s -w -buildid= -X main.version={{.VERSION}}" -o dist/deps_{{.ITEM.OS}}_{{.ITEM.ARCH}}{{if eq .ITEM.OS "windows"}}.exe{{end}} ./cmd/deps
      - task: release:checksums

  release:checksums:
    desc: Write dist/checksums.txt (sha256sum) for the binaries and packages in dist/
    cmds:
      - cd dist && find . -maxdepth 1 -type f -name 'deps*' -printf '%P\n' | LC_ALL=C sort | xargs sha256sum > checksums.txt

  release:packages:
    desc: Build the Debian, Arch Linux and Alpine packages from the release binaries and update dist/checksums.txt
    cmds:
      - task: release:deb
      - task: release:arch
      - task: release:apk

  release:deb:
    desc: Build reproducible dist/deps_<version>_<arch>.deb packages (amd64, arm64) from the release binaries and add them to dist/checksums.txt
    deps: [nfpm:install]
    preconditions:
      - sh: test -f dist/deps_linux_amd64 && test -f dist/deps_linux_arm64
        msg: "dist/deps_linux_* are missing; run task release:build VERSION={{.VERSION}} first"
    cmds:
      - NFPM="{{.NFPM}}" packaging/nfpm/build.sh deb "{{.VERSION}}"
      - task: release:checksums

  release:arch:
    desc: Build reproducible dist/deps-<pkgver>-1-<arch>.pkg.tar.zst Arch Linux packages (x86_64, aarch64) from the release binaries and add them to dist/checksums.txt
    deps: [nfpm:install]
    preconditions:
      - sh: test -f dist/deps_linux_amd64 && test -f dist/deps_linux_arm64
        msg: "dist/deps_linux_* are missing; run task release:build VERSION={{.VERSION}} first"
    cmds:
      - NFPM="{{.NFPM}}" packaging/nfpm/build.sh archlinux "{{.VERSION}}"
      - task: release:checksums

  release:apk:
    desc: Build reproducible dist/deps-<pkgver>-r0-<arch>.apk Alpine packages (x86_64, aarch64) from the release binaries and add them to dist/checksums.txt
    deps: [nfpm:install]
    preconditions:
      - sh: test -f dist/deps_linux_amd64 && test -f dist/deps_linux_arm64
        msg: "dist/deps_linux_* are missing; run task release:build VERSION={{.VERSION}} first"
    cmds:
      - NFPM="{{.NFPM}}" packaging/nfpm/build.sh apk "{{.VERSION}}"
      - task: release:checksums

  release:sbom:
    desc: Write an SPDX 2.3 SBOM of each release binary to dist/attest/deps_linux_<arch>.spdx.json (syft v{{.SYFT_VERSION}})
    deps: [syft:install]
    preconditions:
      - sh: test -f dist/deps_linux_amd64 && test -f dist/deps_linux_arm64
        msg: "dist/deps_linux_* are missing; run task release:build VERSION={{.VERSION}} first"
    env:
      SYFT_CHECK_FOR_APP_UPDATE: "false"
    cmds:
      - mkdir -p dist/attest
      - for: [amd64, arm64]
        cmd: '"{{.SYFT}}" scan -q file:dist/deps_linux_{{.ITEM}} -o spdx-json=dist/attest/deps_linux_{{.ITEM}}.spdx.json'

  release:attest-from-github:
    desc: "Verify the GitHub attestations of TAG against the Gitea release files (DIR, default: download them) and attach them to the Gitea release (TAG=vX.Y.Z [DIR=dist])"
    deps: [cosign:install]
    requires:
      vars: [TAG]
    cmds:
      - COSIGN="{{.COSIGN}}" packaging/attest-from-github.sh "{{.TAG}}" {{if .DIR}}"{{.DIR}}"{{end}}

  nfpm:install:
    desc: Download and checksum-verify nfpm v{{.NFPM_VERSION}} unless present
    status:
      - test -x "{{.NFPM}}"
    cmds:
      - |
        set -eu
        case "$(uname -m)" in
          x86_64|amd64) arch=x86_64; sum=6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750 ;;
          aarch64|arm64) arch=arm64; sum=a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4 ;;
          *) echo "nfpm: unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        name="nfpm_{{.NFPM_VERSION}}_Linux_$arch.tar.gz"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -sSfL -o "$tmp/$name" "https://github.com/goreleaser/nfpm/releases/download/v{{.NFPM_VERSION}}/$name"
        echo "$sum  $tmp/$name" | sha256sum -c --quiet -
        dest="${TMPDIR:-/tmp}/deps-tools/nfpm-{{.NFPM_VERSION}}"
        mkdir -p "$dest"
        tar -xzf "$tmp/$name" -C "$dest" nfpm
        echo "installed $dest/nfpm"

  syft:install:
    desc: Download and checksum-verify syft v{{.SYFT_VERSION}} unless present
    status:
      - test -x "{{.SYFT}}"
    cmds:
      - |
        set -eu
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64; sum=1c2493cfcf52d3367d6cb25780d9190c111c2219c34c820574c43e8bae15c528 ;;
          aarch64|arm64) arch=arm64; sum=ace61b9397ae28189c674ae332d67a8074dafd71e87724dfb8b22412d8253bb5 ;;
          *) echo "syft: unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        name="syft_{{.SYFT_VERSION}}_linux_$arch.tar.gz"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -sSfL -o "$tmp/$name" "https://github.com/anchore/syft/releases/download/v{{.SYFT_VERSION}}/$name"
        echo "$sum  $tmp/$name" | sha256sum -c --quiet -
        dest="${TMPDIR:-/tmp}/deps-tools/syft-{{.SYFT_VERSION}}"
        mkdir -p "$dest"
        tar -xzf "$tmp/$name" -C "$dest" syft
        echo "installed $dest/syft"

  cosign:install:
    desc: Download and checksum-verify cosign v{{.COSIGN_VERSION}} unless present
    status:
      - test -x "{{.COSIGN}}"
    cmds:
      - |
        set -eu
        case "$(uname -m)" in
          x86_64|amd64) arch=amd64; sum=424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa ;;
          aarch64|arm64) arch=arm64; sum=ade83b7aac62e131cacfe96d958948b2150cc9efec46a570a2649b8e27dedad2 ;;
          *) echo "cosign: unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -sSfL -o "$tmp/cosign" "https://github.com/sigstore/cosign/releases/download/v{{.COSIGN_VERSION}}/cosign-linux-$arch"
        echo "$sum  $tmp/cosign" | sha256sum -c --quiet -
        dest="${TMPDIR:-/tmp}/deps-tools/cosign-{{.COSIGN_VERSION}}"
        mkdir -p "$dest"
        install -m 0755 "$tmp/cosign" "$dest/cosign"
        echo "installed $dest/cosign"

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  cover:
    desc: Run race tests with coverage; fail below {{.MIN_COVERAGE}}%
    vars:
      MIN_COVERAGE: 90
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - |
        total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
        echo "total coverage: ${total}%"
        awk -v t="$total" 'BEGIN { exit !(t >= {{.MIN_COVERAGE}}) }' || { echo "coverage below {{.MIN_COVERAGE}}%"; exit 1; }

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  tidy:check:
    desc: Fail if go.mod/go.sum are not tidy
    cmds:
      - go mod tidy -diff

  plan:
    desc: Show the updates deps would make to this repo
    deps: [build]
    cmds:
      - bin/deps plan -v

  dry-run:
    desc: Show the PRs deps would create for this repo
    deps: [build]
    cmds:
      - bin/deps run --dry-run -v

  e2e:github:
    desc: End-to-end test of deps run against a real GitHub repository (not part of ci; needs gh with repo and workflow scopes)
    deps: [build]
    cmds:
      - hack/e2e-github/e2e.sh
