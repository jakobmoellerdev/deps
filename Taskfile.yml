version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  GOLANGCI_LINT_VERSION: 2.15.0
  # Pinned copy installed by lint:install when no matching golangci-lint is on PATH.
  GOLANGCI_LINT_BIN:
    sh: echo "${TMPDIR:-/tmp}/deps-tools/golangci-lint-{{.GOLANGCI_LINT_VERSION}}"
  GOLANGCI_LINT:
    sh: |
      if command -v golangci-lint >/dev/null && [ "$(golangci-lint version --short 2>/dev/null)" = "{{.GOLANGCI_LINT_VERSION}}" ]; then
        command -v golangci-lint
      else
        echo "${TMPDIR:-/tmp}/deps-tools/golangci-lint-{{.GOLANGCI_LINT_VERSION}}"
      fi
  GIT_CLIFF_VERSION: 2.14.2
  # Pinned git-cliff (release notes / CHANGELOG.md), installed by changelog:install unless the
  # same version is on PATH.
  GIT_CLIFF:
    sh: |
      if command -v git-cliff >/dev/null && [ "$(git-cliff --version 2>/dev/null)" = "git-cliff {{.GIT_CLIFF_VERSION}}" ]; then
        command -v git-cliff
      else
        echo "${TMPDIR:-/tmp}/deps-tools/git-cliff-{{.GIT_CLIFF_VERSION}}/git-cliff"
      fi

tasks:
  default:
    desc: Run the CI checks
    cmds:
      - task: ci

  ci:
    desc: Everything CI runs (vet, lint, race tests, coverage gate, formatting, tidy check, generated docs check)
    cmds:
      - task: vet
      - task: lint
      - task: cover
      - task: fmt:check
      - task: tidy:check
      - task: docs:check

  docs:
    desc: Regenerate docs/reference/*.md and deps.schema.json from the schema, the command tree, action.yml and the managers
    cmds:
      - go run ./cmd/deps docs --out docs/reference --schema deps.schema.json --action action.yml

  docs:check:
    desc: Fail if docs/reference or deps.schema.json differ from what `task docs` generates
    cmds:
      - |
        set -eu
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        go run ./cmd/deps docs --out "$tmp/reference" --schema "$tmp/deps.schema.json" --action action.yml
        if ! diff -ru docs/reference "$tmp/reference" || ! diff -u deps.schema.json "$tmp/deps.schema.json"; then
          echo "generated documentation is stale; run 'task docs' and commit the result" >&2
          exit 1
        fi

  lint:
    desc: Run golangci-lint (installs v{{.GOLANGCI_LINT_VERSION}} into $TMPDIR/deps-tools if missing)
    deps: [lint:install]
    cmds:
      - "{{.GOLANGCI_LINT}} run {{.CLI_ARGS}}"

  lint:fix:
    desc: Run golangci-lint with --fix
    deps: [lint:install]
    cmds:
      - "{{.GOLANGCI_LINT}} run --fix"

  lint:install:
    desc: Download and checksum-verify golangci-lint v{{.GOLANGCI_LINT_VERSION}} unless present
    status:
      - test -x "{{.GOLANGCI_LINT}}"
    cmds:
      - |
        set -eu
        name="golangci-lint-{{.GOLANGCI_LINT_VERSION}}-$(go env GOOS)-$(go env GOARCH)"
        base="https://github.com/golangci/golangci-lint/releases/download/v{{.GOLANGCI_LINT_VERSION}}"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -sSfL -o "$tmp/$name.tar.gz" "$base/$name.tar.gz"
        curl -sSfL -o "$tmp/checksums.txt" "$base/golangci-lint-{{.GOLANGCI_LINT_VERSION}}-checksums.txt"
        (cd "$tmp" && grep "  $name.tar.gz\$" checksums.txt | sha256sum -c --quiet -)
        tar -xzf "$tmp/$name.tar.gz" -C "$tmp"
        mkdir -p "$(dirname "{{.GOLANGCI_LINT_BIN}}")"
        mv "$tmp/$name/golangci-lint" "{{.GOLANGCI_LINT_BIN}}"
        echo "installed {{.GOLANGCI_LINT_BIN}}"

  changelog:install:
    desc: Download and checksum-verify git-cliff v{{.GIT_CLIFF_VERSION}} unless present
    status:
      - test -x "{{.GIT_CLIFF}}"
    cmds:
      - |
        set -eu
        case "$(uname -m)" in
          x86_64|amd64) arch=x86_64; sum=26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a ;;
          aarch64|arm64) arch=aarch64; sum=fd27768ea76fea8c3ba3f3247fef2f6604988b629f15e48bf40be5eaa08b8fef2e4087cc9c8af16bc522bc19cc369611fa7692101b513f63469ad58522708600 ;;
          *) echo "git-cliff: unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        name="git-cliff-{{.GIT_CLIFF_VERSION}}-$arch-unknown-linux-gnu.tar.gz"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -sSfL -o "$tmp/$name" "https://github.com/orhun/git-cliff/releases/download/v{{.GIT_CLIFF_VERSION}}/$name"
        echo "$sum  $tmp/$name" | sha512sum -c --quiet -
        dest="${TMPDIR:-/tmp}/deps-tools"
        mkdir -p "$dest"
        tar -xzf "$tmp/$name" -C "$dest"
        echo "installed $dest/git-cliff-{{.GIT_CLIFF_VERSION}}/git-cliff"

  changelog:
    desc: Regenerate CHANGELOG.md (pass `-- --tag vX.Y.Z` to name the unreleased section before tagging)
    deps: [changelog:install]
    cmds:
      - "{{.GIT_CLIFF}} --output CHANGELOG.md {{.CLI_ARGS}}"

  release:notes:
    desc: Write the release notes of the current tag to dist/RELEASE_NOTES.md
    deps: [changelog:install]
    cmds:
      - mkdir -p dist
      - "{{.GIT_CLIFF}} --latest --strip header --output dist/RELEASE_NOTES.md"

  build:
    desc: Build bin/deps (static, no cgo, trimmed)
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/deps ./cmd/deps

  release:build:
    desc: Build static linux/amd64 and linux/arm64 release binaries and checksums into dist/
    env:
      CGO_ENABLED: "0"
    cmds:
      - rm -rf dist && mkdir -p dist
      - for: [amd64, arm64]
        cmd: GOOS=linux GOARCH={{.ITEM}} go build -trimpath -ldflags "-s -w -buildid= -X main.version={{.VERSION}}" -o dist/deps_linux_{{.ITEM}} ./cmd/deps
      - cd dist && sha256sum deps_linux_amd64 deps_linux_arm64 > checksums.txt

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  cover:
    desc: Run race tests with coverage; fail below {{.MIN_COVERAGE}}%
    vars:
      MIN_COVERAGE: 90
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - |
        total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
        echo "total coverage: ${total}%"
        awk -v t="$total" 'BEGIN { exit !(t >= {{.MIN_COVERAGE}}) }' || { echo "coverage below {{.MIN_COVERAGE}}%"; exit 1; }

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  tidy:check:
    desc: Fail if go.mod/go.sum are not tidy
    cmds:
      - go mod tidy -diff

  plan:
    desc: Show the updates deps would make to this repo
    deps: [build]
    cmds:
      - bin/deps plan -v

  dry-run:
    desc: Show the PRs deps would create for this repo
    deps: [build]
    cmds:
      - bin/deps run --dry-run -v

  e2e:github:
    desc: End-to-end test of deps run against a real GitHub repository (not part of ci; needs gh with repo and workflow scopes)
    deps: [build]
    cmds:
      - hack/e2e-github/e2e.sh
