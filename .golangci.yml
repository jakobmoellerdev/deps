version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose      # HTTP bodies are streamed; a leak pins connections of the shared client
    - copyloopvar
    - errorlint      # errors are wrapped with %w throughout; compare with errors.Is/As
    - gocritic
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx          # every request and process must honour cancellation
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - sloglint       # consistent key/value pairs in log/slog calls
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability over a few bytes per struct
        - shadow         # `err` shadowing in nested scopes is idiomatic here
    staticcheck:
      # Defaults plus QF1001: "apply De Morgan's law" makes byte-class checks harder to read.
      checks: [all, -ST1000, -ST1003, -ST1016, -ST1020, -ST1021, -ST1022, -QF1001]
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam      # dep.Dep/dep.Update are passed by value on purpose (immutable records)
        - rangeValCopy
        - unnamedResult
    revive:
      rules:
        - name: exported
          disabled: true # internal packages; doc comments where they help, not on every symbol
        - name: package-comments
          disabled: true
    sloglint:
      kv-only: true
      no-global: ""
      context: scope
      key-naming-case: camel
    misspell:
      locale: US
  exclusions:
    presets:
      - std-error-handling # unchecked Close/Fprint* on stderr/stdout
    rules:
      - path: _test\.go
        linters: [bodyclose, errcheck, noctx, prealloc, perfsprint, unparam]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - git.jakob-moeller.cloud/jakobmoellerdev/deps
