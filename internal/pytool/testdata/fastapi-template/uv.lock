# Source: https://github.com/fastapi/full-stack-fastapi-template/blob/aabb90126964a164e02aff39e7c385bb0598236d/uv.lock (fetched 2026-11-04), trimmed to some packages without sdist/wheels
version = 1
revision = 5
requires-python = ">=3.14, <4.0"
resolution-markers = [
    "python_full_version >= '3.15'",
    "python_full_version < '3.15'",
]

[manifest]
members = [
    "app",
]

[manifest.dependency-groups]
dev = [
    { name = "prek", specifier = ">=0.5.3,<1.0.0" },
    { name = "typer", specifier = ">=0.27.2,<1.0.0" },
    { name = "zizmor", specifier = ">=1.30.1" },
]
github-actions = [{ name = "smokeshow", specifier = ">=0.5.0" }]

[[package]]
name = "alembic"
version = "1.20.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "mako" },
    { name = "sqlalchemy" },
    { name = "typing-extensions" },
]

[[package]]
name = "app"
version = "0.1.0"
source = { editable = "backend" }
dependencies = [
    { name = "alembic" },
    { name = "email-validator" },
    { name = "emails" },
    { name = "fastapi", extra = ["standard"] },
    { name = "httpx" },
    { name = "jinja2" },
    { name = "psycopg", extra = ["binary"] },
    { name = "pwdlib", extra = ["argon2", "bcrypt"] },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "pyjwt" },
    { name = "python-multipart" },
    { name = "sentry-sdk", extra = ["fastapi"] },
    { name = "sqlmodel" },
]

[package.dev-dependencies]
dev = [
    { name = "coverage" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "ruff" },
    { name = "ty" },
]

[package.metadata]
requires-dist = [
    { name = "alembic", specifier = ">=1.19.1,<2.0.0" },
    { name = "email-validator", specifier = ">=2.1.0.post1,<3.0.0.0" },
    { name = "emails", specifier = ">=1.1.2,<2.0" },
    { name = "fastapi", extras = ["standard"], specifier = ">=0.141.1,<1.0.0" },
    { name = "httpx", specifier = ">=0.25.1,<1.0.0" },
    { name = "jinja2", specifier = ">=3.1.4,<4.0.0" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.3.6,<4.0.0" },
    { name = "pwdlib", extras = ["argon2", "bcrypt"], specifier = ">=0.3.1" },
    { name = "pydantic", specifier = ">=2.13.5" },
    { name = "pydantic-settings", specifier = ">=2.2.1,<3.0.0" },
    { name = "pyjwt", specifier = ">=2.15.0,<3.0.0" },
    { name = "python-multipart", specifier = ">=0.0.27,<1.0.0" },
    { name = "sentry-sdk", extras = ["fastapi"], specifier = ">=2.70.0,<3.0.0" },
    { name = "sqlmodel", specifier = ">=0.0.46,<1.0.0" },
]

[package.metadata.requires-dev]
dev = [
    { name = "coverage", specifier = ">=7.4.3,<8.0.0" },
    { name = "mypy", specifier = ">=1.8.0,<3.0.0" },
    { name = "pytest", specifier = ">=7.4.3,<10.0.0" },
    { name = "ruff", specifier = ">=0.16.0,<1.0.0" },
    { name = "ty", specifier = ">=0.0.25" },
]

[[package]]
name = "emails"
version = "1.1.2"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "dkimpy" },
    { name = "puremagic" },
    { name = "python-dateutil" },
]

[[package]]
name = "fastapi"
version = "0.141.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "annotated-doc" },
    { name = "pydantic" },
    { name = "starlette" },
    { name = "typing-extensions" },
    { name = "typing-inspection" },
]

[package.optional-dependencies]
standard = [
    { name = "email-validator" },
    { name = "fastapi-cli", extra = ["standard"] },
    { name = "fastar" },
    { name = "httpx" },
    { name = "jinja2" },
    { name = "pydantic-extra-types" },
    { name = "pydantic-settings" },
    { name = "python-multipart" },
    { name = "uvicorn", extra = ["standard"] },
]

[[package]]
name = "httpx"
version = "0.28.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "anyio" },
    { name = "certifi" },
    { name = "httpcore" },
    { name = "idna" },
]

[[package]]
name = "jinja2"
version = "3.1.6"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "markupsafe" },
]

[[package]]
name = "mypy"
version = "2.3.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "ast-serialize" },
    { name = "librt", marker = "platform_python_implementation != 'PyPy'" },
    { name = "mypy-extensions" },
    { name = "pathspec" },
    { name = "typing-extensions" },
]

[[package]]
name = "pydantic"
version = "2.13.5"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "annotated-types" },
    { name = "pydantic-core" },
    { name = "typing-extensions" },
    { name = "typing-inspection" },
]

[package.optional-dependencies]
email = [
    { name = "email-validator" },
]

[[package]]
name = "pytest"
version = "9.1.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "colorama", marker = "sys_platform == 'win32'" },
    { name = "iniconfig" },
    { name = "packaging" },
    { name = "pluggy" },
    { name = "pygments" },
]

[[package]]
name = "python-multipart"
version = "0.0.32"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "ruff"
version = "0.16.9"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "sqlmodel"
version = "0.0.47"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "pydantic" },
    { name = "sqlalchemy" },
    { name = "typing-extensions" },
]
