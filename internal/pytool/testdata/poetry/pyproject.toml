# Source: https://github.com/python-poetry/poetry/blob/6ecadf5b71309b1da4f00949cc349a79884cff8f/pyproject.toml (fetched 2026-11-04), trimmed
[project]
name = "poetry"
version = "2.5.1"
description = "Python dependency management and packaging made easy."
requires-python = ">=3.11"
dependencies = [
    "poetry-core (==2.5.0)",
    "build (>=1.2.1,<2.0.0)",
    "cachecontrol[filecache] (>=0.14.0,<0.15.0)",
    "cleo (>=2.1.0,<3.0.0)",
    "dulwich (>=0.25.0,<2)",
    "fastjsonschema (>=2.18.0,<3.0.0)",
    "installer (>=0.7.0,<2.0.0)",
    "keyring (>=25.1.0,<26.0.0)",
    # packaging uses calver, so version is unclamped
    "packaging (>=24.2)",  # PEP 639 support was added in 24.2
    "pkginfo (>=1.12,<2.0)",
    "platformdirs (>=3.0.0,<5)",
    "pyproject-hooks (>=1.0.0,<2.0.0)",
    "requests (>=2.26,<3.0)",
    "requests-toolbelt (>=1.0.0,<2.0.0)",
    "shellingham (>=1.5,<2.0)",
    "tomlrt (>=2.2.1,<3)",
    # trove-classifiers uses calver, so version is unclamped
    "trove-classifiers (>=2022.5.19)",
    "virtualenv (>=20.26.6)",
    "xattr (>=1.0.0,<2.0.0) ; sys_platform == 'darwin'",
    "findpython (>=0.6.2,<0.9.0)",
    # pbs-installer uses calver, so version is unclamped
    "pbs-installer[download,install] (>=2025.6.10)",
]

[dependency-groups]
dev = [
    "pre-commit>=2.10",
]
test = [
    "coverage>=7.2.0",
    # test_clone_with_lfs_files relies on being able to use
    # locally cloned LFS stores, which requires dulwich>=1.2.1
    "dulwich>=1.2.1",
    "responses>=0.25.8",
    "jaraco-classes>=3.3.1",
    "pytest>=9.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.9",
    "pytest-randomly>=3.12",
    "pytest-xdist[psutil]>=3.1",
]
typing = [
    "mypy>=1.8.0",
    "types-requests>=2.28.8",
]
github-actions = [
    "pytest-github-actions-annotate-failures>=0.1.7,<0.2"
]

[tool.poetry]
requires-poetry = ">=2.0"
classifiers = [
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
include = [{ path = "tests", format = "sdist" }]

[tool.poetry.dependencies]
python = ">=3.11,<4"

# only used in github actions
[tool.poetry.group.github-actions]
optional = true
