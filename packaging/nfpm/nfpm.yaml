# nfpm configuration of the Debian, RPM, Arch Linux and Alpine packages. packaging/nfpm/build.sh sets GOARCH,
# PKG_VERSION, PKG_RELEASE, DIST and COMPLETIONS; every mtime is SOURCE_DATE_EPOCH.
name: deps
arch: ${GOARCH}
platform: linux
# build.sh maps the tag to the distribution's version rules itself.
version: ${PKG_VERSION}
version_schema: none
release: ${PKG_RELEASE}
maintainer: Jakob Möller <contact@jakob-moeller.com>
description: dependency updates for GitHub, Gitea and Forgejo repositories
section: devel
priority: optional
homepage: https://git.jakob-moeller.cloud/jakobmoellerdev/deps
license: Apache-2.0
contents:
  - src: ${DIST}/deps_linux_${GOARCH}
    dst: /usr/bin/deps
    expand: true
    file_info:
      mode: 0755
  - src: ${COMPLETIONS}/bash
    dst: /usr/share/bash-completion/completions/deps
    expand: true
    file_info:
      mode: 0644
  - src: ${COMPLETIONS}/zsh
    dst: /usr/share/zsh/site-functions/_deps
    packager: archlinux
    expand: true
    file_info:
      mode: 0644
  - src: ${COMPLETIONS}/zsh
    dst: /usr/share/zsh/site-functions/_deps
    packager: apk
    expand: true
    file_info:
      mode: 0644
  - src: ${COMPLETIONS}/zsh
    dst: /usr/share/zsh/site-functions/_deps
    packager: rpm
    expand: true
    file_info:
      mode: 0644
  - src: ${COMPLETIONS}/zsh
    dst: /usr/share/zsh/vendor-completions/_deps
    packager: deb
    expand: true
    file_info:
      mode: 0644
  - src: ${COMPLETIONS}/fish
    dst: /usr/share/fish/vendor_completions.d/deps.fish
    expand: true
    file_info:
      mode: 0644
  - src: ${LICENSE_FILE}
    dst: /usr/share/licenses/deps/LICENSE
    packager: archlinux
    expand: true
    file_info:
      mode: 0644
  - src: ${LICENSE_FILE}
    dst: /usr/share/licenses/deps/LICENSE
    packager: apk
    expand: true
    file_info:
      mode: 0644
  - src: ${LICENSE_FILE}
    dst: /usr/share/licenses/deps/LICENSE
    packager: rpm
    expand: true
    file_info:
      mode: 0644
  - src: ${LICENSE_FILE}
    dst: /usr/share/doc/deps/copyright
    packager: deb
    expand: true
    file_info:
      mode: 0644
# deps run needs git. apt and dnf install Recommends by default; pacman never installs optional dependencies, so Arch lists it as one;
# Alpine has no optional dependencies, so the apk depends on it (as apt installs the deb's
# Recommends by default).
overrides:
  deb:
    recommends:
      - git
  rpm:
    recommends:
      - git
  archlinux:
    recommends:
      - "git: deps run pushes branches with git"
  apk:
    depends:
      - git
archlinux:
  packager: Jakob Möller <contact@jakob-moeller.com>
# The RPM header records the build host (default os.Hostname()); a fixed one keeps the RPMs
# identical across the Gitea and GitHub release builds.
rpm:
  buildhost: deps
