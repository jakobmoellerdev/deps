name: deps
description: Update dependencies and open one pull request per dependency or group
inputs:
  token:
    description: >-
      Platform token, exported to deps as DEPS_TOKEN. It needs contents:write and pull-requests:write
      (issues:write for the dependency dashboard). The default is the job token on GitHub, Gitea and
      Forgejo; on GitHub, PRs created with it do not trigger workflows and it cannot push changes to
      .github/workflows/*, so pass an App token or PAT (with workflows permission) here and to
      actions/checkout.
    default: "${{ github.token }}"
  signing-key:
    description: >-
      Secret holding a passphrase-less private key (OpenSSH, or armored OpenPGP) that deps signs its
      commits with, exported as DEPS_SIGNING_KEY. The committer identity (config key gitAuthor, or
      DEPS_GIT_AUTHOR in the job env) must be the key owner's verified email on the forge for the
      signature to count as verified. Default: unsigned commits.
    default: ""
  args:
    description: "Arguments for deps, e.g. `run -v --log-level info` or `plan`."
    default: "run"
  version:
    description: >-
      Release tag to download, e.g. v0.1.0. Default: the action's ref when it is a release tag
      (`@v0.1.0`), else the latest release. When it equals the ref's version (`@<sha> # v0.1.0` with
      `version: v0.1.0`), deps updates it together with the ref.
    default: ""
  repository:
    description: >-
      Repository URL the release is downloaded from. A Gitea/Forgejo URL finds the latest release via
      `<host>/api/v1/repos/<repo>/releases/latest`; a GitHub URL via api.github.com, and on github.com
      runners the assets are fetched with `gh release download` and the job token, so private
      repositories work. Default: https://github.com/jakobmoellerdev/deps on github.com runners,
      https://git.jakob-moeller.cloud/jakobmoellerdev/deps elsewhere.
    default: ""
  use-preinstalled:
    description: >-
      Use a `deps` already on PATH (e.g. baked into the runner image) when `deps version` prints the
      resolved version; the cache and download steps are skipped then. The binary is trusted as is:
      it is not checked against the release's checksums.txt. `false` always uses the cache/download
      path.
    default: "true"
  cache:
    description: >-
      Reuse a verified binary of the same version instead of downloading it. The runner's tool cache
      (`$RUNNER_TOOL_CACHE/deps/<version>/<arch>`, kept between jobs on self-hosted runners) is
      checked first, then the forge's Actions cache (key `deps-<version>-<os>-<arch>`), which is
      filled after a download. A cached binary is used only if its sha256 matches the checksum
      recorded from the release's checksums.txt. `false` downloads every run.
    default: "true"
outputs:
  version:
    description: The deps release that ran, e.g. v0.1.0.
    value: ${{ steps.resolve.outputs.version }}
  cache-hit:
    description: >-
      `preinstalled` if a matching `deps` on PATH was used, `true` if the binary came from the tool
      cache or the Actions cache, `false` if it was downloaded.
    value: ${{ steps.preinstalled.outputs.bin && 'preinstalled' || steps.install.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve deps version
      id: resolve
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        REPOSITORY: ${{ inputs.repository }}
        SERVER_URL: ${{ github.server_url }}
        TOKEN: ${{ github.token }}
        CACHE: ${{ inputs.cache }}
      run: |
        set -euo pipefail
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64|Linux/amd64) arch=amd64 ;;
          Linux/aarch64|Linux/arm64) arch=arm64 ;;
          *) echo "deps: unsupported runner $(uname -s)/$(uname -m); only linux/amd64 and linux/arm64 are released" >&2; exit 1 ;;
        esac
        # Releases are published on both forges; GitHub runners can't always reach the Gitea
        # instance (its edge blocks datacenter traffic), so github.com jobs use the mirror.
        if [ -z "$REPOSITORY" ]; then
          case "$SERVER_URL" in
            https://github.com) REPOSITORY=https://github.com/jakobmoellerdev/deps ;;
            *) REPOSITORY=https://git.jakob-moeller.cloud/jakobmoellerdev/deps ;;
          esac
        fi
        repo="${REPOSITORY%/}"
        host="${repo%/*/*}"; path="${repo#"$host"/}"
        if [ -z "$VERSION" ] && [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="$ACTION_REF"; fi
        if [ -z "$VERSION" ]; then
          auth=()
          case "$host" in
            https://github.com)
              api="https://api.github.com/repos/$path/releases/latest"
              # the job token raises the API rate limit (runner IPs share the anonymous one)
              if [ "$SERVER_URL" = https://github.com ] && [ -n "$TOKEN" ]; then auth=(-H "Authorization: Bearer $TOKEN"); fi ;;
            *) api="$host/api/v1/repos/$path/releases/latest" ;;
          esac
          VERSION=$(curl -fsSL "${auth[@]}" "$api" | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1)
          [ -n "$VERSION" ] || { echo "deps: no release found at $api" >&2; exit 1; }
        fi
        # The tool cache survives between jobs on self-hosted runners; a fresh dir per run otherwise.
        dir="$RUNNER_TEMP/deps-$VERSION"
        if [ "$CACHE" != false ] && [ -n "${RUNNER_TOOL_CACHE:-}" ] && mkdir -p "$RUNNER_TOOL_CACHE/deps/$VERSION/$arch" 2>/dev/null \
          && [ -w "$RUNNER_TOOL_CACHE/deps/$VERSION/$arch" ]; then
          dir="$RUNNER_TOOL_CACHE/deps/$VERSION/$arch"
        fi
        mkdir -p "$dir"
        echo "deps: $VERSION linux/$arch from $repo, binary dir $dir"
        {
          echo "version=$VERSION"
          echo "arch=$arch"
          echo "repo=$repo"
          echo "dir=$dir"
          echo "key=deps-$VERSION-linux-$arch"
        } >> "$GITHUB_OUTPUT"
    - name: Check for a preinstalled deps
      id: preinstalled
      if: inputs.use-preinstalled != 'false'
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        set -euo pipefail
        if bin="$(command -v deps)" && [ "$("$bin" version 2>/dev/null)" = "$VERSION" ]; then
          echo "deps: using preinstalled deps $VERSION ($bin)"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
        else
          echo "deps: no preinstalled deps $VERSION on PATH"
        fi
    - name: Check tool cache
      id: toolcache
      if: inputs.cache != 'false' && !steps.preinstalled.outputs.bin
      shell: bash
      env:
        DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        set -euo pipefail
        if [ -f "$DIR/deps" ] && [ -f "$DIR/deps.sha256" ] && (cd "$DIR" && sha256sum -c --quiet --status deps.sha256); then
          echo "deps: found verified binary in the tool cache ($DIR)"
          echo "hit=true" >> "$GITHUB_OUTPUT"
        else
          echo "deps: not in the tool cache ($DIR)"
        fi
    - name: Restore deps from the Actions cache
      id: restore
      if: inputs.cache != 'false' && !steps.preinstalled.outputs.bin && steps.toolcache.outputs.hit != 'true'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ steps.resolve.outputs.dir }}
        key: ${{ steps.resolve.outputs.key }}
    - name: Install deps
      id: install
      if: ${{ !steps.preinstalled.outputs.bin }}
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        ARCH: ${{ steps.resolve.outputs.arch }}
        REPO: ${{ steps.resolve.outputs.repo }}
        DIR: ${{ steps.resolve.outputs.dir }}
        TOOL_CACHE_HIT: ${{ steps.toolcache.outputs.hit }}
        RESTORE_HIT: ${{ steps.restore.outputs.cache-hit }}
        SERVER_URL: ${{ github.server_url }}
        TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        verify() { [ -f "$DIR/deps" ] && [ -f "$DIR/deps.sha256" ] && (cd "$DIR" && sha256sum -c --quiet --status deps.sha256); }
        hit=false
        if [ "$TOOL_CACHE_HIT" = true ] || [ "$RESTORE_HIT" = true ]; then
          if verify; then
            hit=true
            if [ "$TOOL_CACHE_HIT" = true ]; then echo "deps: cache hit, using $VERSION from the tool cache"; else echo "deps: cache hit, using $VERSION restored from the Actions cache"; fi
          else
            echo "::warning::deps: cached $VERSION binary in $DIR does not match its recorded checksum; downloading it again"
          fi
        fi
        if [ "$hit" = false ]; then
          host="${REPO%/*/*}"; path="${REPO#"$host"/}"
          tmp="$(mktemp -d "$RUNNER_TEMP/deps-download.XXXXXX")"
          echo "deps: downloading $VERSION (linux/$ARCH) from $REPO"
          if [ "$host" = https://github.com ] && [ "$SERVER_URL" = https://github.com ] && command -v gh >/dev/null; then
            # gh downloads through the API with the job token, which also works for private repositories.
            GH_TOKEN="$TOKEN" gh release download "$VERSION" -R "$path" -D "$tmp" -p checksums.txt -p "deps_linux_$ARCH"
          else
            base="$REPO/releases/download/$VERSION"
            curl -fsSL -o "$tmp/checksums.txt" "$base/checksums.txt"
            curl -fsSL -o "$tmp/deps_linux_$ARCH" "$base/deps_linux_$ARCH"
          fi
          sum="$(sed -n "s/^\([0-9a-f]\{64\}\)  deps_linux_$ARCH\$/\1/p" "$tmp/checksums.txt")"
          [ -n "$sum" ] || { echo "deps: checksums.txt of $VERSION has no entry for deps_linux_$ARCH" >&2; exit 1; }
          (cd "$tmp" && printf '%s  deps_linux_%s\n' "$sum" "$ARCH" | sha256sum -c --quiet -)
          # Write next to the binary atomically; concurrent jobs on one runner share the tool cache.
          install -m 0755 "$tmp/deps_linux_$ARCH" "$DIR/.deps.$$"
          printf '%s  deps\n' "$sum" > "$DIR/.deps.sha256.$$"
          mv -f "$DIR/.deps.$$" "$DIR/deps"
          mv -f "$DIR/.deps.sha256.$$" "$DIR/deps.sha256"
          rm -rf "$tmp"
          verify
        fi
        echo "cache-hit=$hit" >> "$GITHUB_OUTPUT"
        echo "downloaded=$([ "$hit" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
        "$DIR/deps" version
    - name: Save deps to the Actions cache
      if: inputs.cache != 'false' && steps.install.outputs.downloaded == 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ steps.resolve.outputs.dir }}
        key: ${{ steps.resolve.outputs.key }}
    - name: Run deps
      shell: bash
      env:
        BIN: ${{ steps.preinstalled.outputs.bin || format('{0}/deps', steps.resolve.outputs.dir) }}
        DEPS_TOKEN: ${{ inputs.token }}
        DEPS_SIGNING_KEY: ${{ inputs.signing-key }}
      run: '"$BIN" ${{ inputs.args }}'
