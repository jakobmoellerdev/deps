# Valkey for `deps serve`: the control plane (inventory, due queue, leases, run history)
# and the shared registry metadata cache.
#
# There is no persistence on purpose. Nothing here is a source of truth: the forge holds the
# real state in the update branches, the fingerprints in the PR bodies and the dependency
# dashboard, so losing Valkey costs one inventory refresh and a cold cache. allkeys-lru means
# a full cache degrades to more upstream requests, never to errors.
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels: {app.kubernetes.io/name: valkey, app.kubernetes.io/part-of: deps}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: valkey}
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  labels: {app.kubernetes.io/name: valkey, app.kubernetes.io/part-of: deps}
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: valkey}
  template:
    metadata:
      labels: {app.kubernetes.io/name: valkey, app.kubernetes.io/part-of: deps}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          args:
            - valkey-server
            - --maxmemory
            - 32gb
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "no"
            - --save
            - ""
          ports:
            - {name: valkey, containerPort: 6379}
          resources:
            requests: {cpu: 500m, memory: 34Gi}
            limits: {memory: 34Gi}
          readinessProbe:
            exec: {command: ["valkey-cli", "ping"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: valkey}
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
