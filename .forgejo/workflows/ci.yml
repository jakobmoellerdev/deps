name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
# A newer push to the same PR or branch cancels the superseded run. Each tag is its own
# group, so a release is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Lets the release job ask Forgejo for a short-lived OIDC JWT, so the package upload needs no static
# token; see the Publish packages step.
enable-openid-connect: true

jobs:
  # check and test run as parallel jobs.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # The runners mount shared Go cache volumes (monstera ci/runner/config.yaml); restoring the
          # cache here would unpack ~1 GB per job over them.
          cache: false
      # The pinned golangci-lint binary (task lint:install), so it is not downloaded from GitHub
      # on every run. One cache entry per version.
      - id: lint
        run: |
          echo "version=$(sed -n 's/^GOLANGCI_LINT_VERSION=//p' .env)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: /tmp/deps-tools/golangci-lint-${{ steps.lint.outputs.version }}
          key: golangci-lint-${{ steps.lint.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - run: task check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: task cover
  # Release tags reuse the check and test results instead of running task ci again.
  release:
    needs: [check, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs the history and tags for the notes
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: task release:build VERSION="${GITHUB_REF_NAME}"
      - run: task release:notes
      - name: Check binaries are static
        run: |
          set -euo pipefail
          # The action runs these on arbitrary runner images: no dynamic loader allowed.
          for f in dist/bin/deps_linux_*; do
            if readelf -l "$f" | grep -q 'Requesting program interpreter'; then echo "$f is not static" >&2; exit 1; fi
          done
      - run: task release:packages VERSION="${GITHUB_REF_NAME}"
      - name: Publish packages
        # Debian, RPM, Arch Linux and Alpine registries of the owner. The job token can only read
        # packages, so the upload authenticates with a short-lived OIDC JWT instead: the Authorized
        # Integration "deps release packages" of the owner exchanges it for write:package, but only
        # for a JWT whose claims say this repository, this workflow file and a refs/tags/v* ref.
        # Re-runs skip files that are already published with the same content.
        env:
          PACKAGES_URL: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}
          PACKAGES_USER: ${{ github.repository_owner }}
          # Audience of the Authorized Integration; not confidential.
          AUD: u:1:4589c074-43a8-4f8b-8f56-91ed3b250089
        run: |
          PACKAGES_TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
          echo "::add-mask::$PACKAGES_TOKEN"
          export PACKAGES_TOKEN
          packaging/publish.sh dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.apk
      - name: Publish release
        # packaging/forge-release.sh talks to the forge API with the job token; no forge CLI on the runner.
        env:
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          packaging/forge-release.sh create "$GITHUB_REF_NAME" dist/RELEASE_NOTES.md \
            dist/deps_*.tar.xz dist/deps_*.zip dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.apk dist/deps.schema.json dist/checksums.txt
      - name: Attach the GitHub attestations
        # Forgejo has no Actions OIDC, so the release is attested on the GitHub mirror, which builds the
        # same bytes. Waits (up to 30 min) for the GitHub release, verifies every bundle against
        # dist/ with cosign and uploads the bundles and SBOMs here. The release above is already
        # public, so a failure only leaves it unattested; re-run with .forgejo/workflows/attest.yml.
        env:
          FORGEJO_TOKEN: ${{ github.token }}
        run: task release:attest-from-github TAG="${GITHUB_REF_NAME}" DIR=dist
