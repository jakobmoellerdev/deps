name: deps
on:
  schedule:
    - cron: "0 5 * * *"
  # Re-run right after merges (e.g. a deps PR) to rebase the other PRs; docs/ci.md#run-on-push-to-the-default-branch
  push:
    branches: [main]
  workflow_dispatch:
  # Preview with the PR's code: the dry-run job below; docs/ci.md#preview-on-pull-requests
  pull_request:
    branches: [main]
# There is no bot token any more: the deps job fetches a short-lived OIDC JWT and deps-bot's Authorized
# Integration "deps dependency PRs" exchanges it for write:repository + write:issue on this repository and
# monstera, only for a JWT whose claims say a jakobmoellerdev/* repository and workflow deps.yml.
enable-openid-connect: true
env:
  # deps-bot's verified email; its OpenPGP key (DEPS_SIGNING_KEY) is verified on that account.
  # The dry run needs it too: branches with another author are reported as modified by someone else.
  DEPS_GIT_AUTHOR: deps-bot <deps-bot@jakob-moeller.cloud>
jobs:
  deps:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deps
      cancel-in-progress: false
    steps:
      # Audience of deps-bot's Authorized Integration; it only names the integration and is not confidential.
      - id: jwt
        env:
          AUD: u:2:cf825b7f-7aea-4218-9260-68311fc42be1
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.jwt.outputs.jwt }}
      # The published release, as users run it; deps bumps this pin itself after each release.
      - uses: https://git.jakob-moeller.cloud/jakobmoellerdev/deps@v0.11.0
        with:
          token: ${{ steps.jwt.outputs.jwt }}
          signing-key: ${{ secrets.DEPS_SIGNING_KEY }}
          args: run --log-level info
  # Builds deps from the PR and shows what it would do: `plan` on the PR (its .deps.yaml and
  # dependencies), `preview` (how the PR changes the update PRs against the base branch), then
  # `run --dry-run` on the base branch, which reports against its checkout (if main moves
  # during the job, it only warns). Read-only; its own concurrency group, so it never waits
  # for the deps job.
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deps-dry-run-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: pr
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: pr/go.mod
          cache: false # shared Go cache volumes on the runners, see ci.yml
      - run: go build -C pr -trimpath -o "$RUNNER_TEMP/deps" ./cmd/deps
      - run: '"$RUNNER_TEMP/deps" plan --show-skipped --log-level info --dir pr'
      - run: '"$RUNNER_TEMP/deps" preview --log-level info --dir pr --base-dir base'
      - run: '"$RUNNER_TEMP/deps" run --dry-run --show-skipped --log-level info --dir base --base "$BASE"'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          DEPS_TOKEN: ${{ github.token }}
