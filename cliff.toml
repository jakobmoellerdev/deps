# git-cliff configuration: release notes and CHANGELOG.md from the git history.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to deps are listed here; generated by git-cliff from the commit history.\n
"""
body = """
{% if version -%}
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
# Conventional commits are grouped by type; other commit subjects are kept, not dropped,
# so early history without a type still shows up (under "Changes").
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^Merge pull request", skip = true },
  { message = "^Initial commit", skip = true },
  { message = "^chore\\(deps\\)", group = "<!-- 4 -->Dependencies" },
  { message = "^fix\\(deps\\)", group = "<!-- 4 -->Dependencies" },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^[Pp]erformance", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^(ci|build)", group = "<!-- 5 -->CI and build" },
  { message = "^(chore|refactor|style|test)", group = "<!-- 6 -->Maintenance" },
  { message = ".*", group = "<!-- 0 -->Changes" },
]
