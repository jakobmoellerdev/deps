# Publishes each v* release on the GitHub mirror too, so GitHub runners download the action's
# binary from github.com. The tag arrives through the Gitea push mirror; tests already ran on
# Gitea for that commit, so this only builds, writes the notes, attests and publishes.
#
# The release files are attested keyless with Sigstore (SLSA build provenance for every file, an
# SPDX SBOM of each Linux binary for the archive that ships it). The bundles are release assets
# too; the Gitea release job verifies them against its own byte-identical build and attaches them
# there (packaging/attest-from-github.sh).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish"
        required: true
permissions:
  contents: write
  id-token: write # Sigstore signing certificate from Fulcio
  attestations: write # store the attestations in the repository's attestations API
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # git-cliff needs the history and tags for the notes
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ github.token }}
      - run: task release:build VERSION="$TAG"
      - run: task release:notes
      - name: Check binaries are static
        run: |
          set -euo pipefail
          # dist/bin holds the binaries; releases up to v0.6.0 (republished from their tag) have
          # them in dist/ and no archives.
          shopt -s nullglob
          for f in dist/bin/deps_linux_* dist/deps_linux_amd64 dist/deps_linux_arm64; do
            if readelf -l "$f" | grep -q 'Requesting program interpreter'; then echo "$f is not static" >&2; exit 1; fi
          done
      - run: task release:packages VERSION="$TAG"
      # Older tags (republished with workflow_dispatch) lack release:sbom, so the SBOM task comes
      # from the Taskfile of this workflow's revision; the build above used the tag's. Task reads
      # .env relative to --dir (the tag's checkout), so the tooling's .env is exported instead.
      - uses: actions/checkout@v7.0.1
        with:
          path: .release-tooling
          sparse-checkout: |
            Taskfile.yml
            .env
          sparse-checkout-cone-mode: false
      - run: set -a && . .release-tooling/.env && set +a && task --taskfile "$GITHUB_WORKSPACE/.release-tooling/Taskfile.yml" --dir "$GITHUB_WORKSPACE" release:sbom
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # The archives (bare binaries for releases up to v0.6.0); dist/bin is not released.
          subject-path: |
            dist/deps_linux_*
            dist/deps_darwin_*
            dist/deps_windows_*
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.apk
            dist/deps.schema.json
            dist/checksums.txt
      # The SBOM of each Linux binary is attested for the release file that ships it: the archive
      # deps_linux_<arch>.tar.xz, or the bare binary of releases up to v0.6.0. release:sbom names
      # the SBOM after that file.
      - name: SBOM subjects
        id: sbom
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            f=deps_linux_$arch.tar.xz
            [ -f "dist/$f" ] || f=deps_linux_$arch
            echo "$arch=$f" >> "$GITHUB_OUTPUT"
          done
      - name: Attest SBOM (amd64)
        id: sbom-amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.sbom.outputs.amd64 }}
          sbom-path: dist/attest/${{ steps.sbom.outputs.amd64 }}.spdx.json
      - name: Attest SBOM (arm64)
        id: sbom-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.sbom.outputs.arm64 }}
          sbom-path: dist/attest/${{ steps.sbom.outputs.arm64 }}.spdx.json
      - name: Name the bundles after their assets
        # One provenance attestation covers every file; each file gets a copy named after it, so
        # `<asset>.sigstore.json` is the bundle to pass to `gh attestation verify --bundle`.
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_AMD64: ${{ steps.sbom-amd64.outputs.bundle-path }}
          SBOM_ARM64: ${{ steps.sbom-arm64.outputs.bundle-path }}
          SUBJECT_AMD64: ${{ steps.sbom.outputs.amd64 }}
          SUBJECT_ARM64: ${{ steps.sbom.outputs.arm64 }}
        run: |
          set -euo pipefail
          for f in $(awk '{print $2}' dist/checksums.txt) checksums.txt; do
            cp "$PROVENANCE" "dist/attest/$f.sigstore.json"
          done
          cp "$SBOM_AMD64" "dist/attest/$SUBJECT_AMD64.sbom.sigstore.json"
          cp "$SBOM_ARM64" "dist/attest/$SUBJECT_ARM64.sbom.sigstore.json"
          ls -l dist/attest
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/deps_linux_* dist/deps_darwin_* dist/deps_windows_* dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.apk dist/deps.schema.json dist/checksums.txt dist/attest/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${files[@]}"
            gh release edit "$TAG" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file dist/RELEASE_NOTES.md "${files[@]}"
          fi
