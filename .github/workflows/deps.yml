# Runs deps on the GitHub mirror of git.jakob-moeller.cloud/jakobmoellerdev/deps.
# The mirror has pull requests and issues disabled, and it is a Gitea push mirror (every sync
# force-pushes Gitea's refs and prunes all others), so deps cannot open PRs here. It runs `plan`
# instead: the same action, binary download, platform setup and resolution as on Gitea, with
# the updates listed in the job summary. PRs are made on Gitea.
name: deps
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./
        with:
          args: plan
          show-skipped: true
          log-level: info
