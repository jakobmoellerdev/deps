name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  # check and test run as parallel jobs. Each restores the newest build cache of its kind
  # (restore-keys) instead of setup-go's, whose key is go.sum and thus never refreshes: stale
  # entries meant recompiling every changed package and rerunning every test. Only pushes (main,
  # tags) save a cache, so pull requests pay no upload.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          # golangci-lint: its binary (lint:install) and analysis cache.
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
            /tmp/deps-tools
          key: go-check-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-check-${{ hashFiles('go.sum') }}-
            go-check-
      - run: task check
      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
            /tmp/deps-tools
          key: ${{ steps.cache.outputs.cache-primary-key }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          # Race and coverage builds plus the test cache: unchanged packages report (cached).
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ hashFiles('go.sum') }}-
            go-test-
      - run: task cover
      - if: github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}
  # Release tags reuse the check and test results instead of running task ci again.
  release:
    needs: [check, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs the history and tags for the notes
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: task release:build VERSION="${GITHUB_REF_NAME}"
      - run: task release:notes
      - name: Check binaries are static
        run: |
          set -euo pipefail
          # The action runs these on arbitrary runner images: no dynamic loader allowed.
          for f in dist/deps_linux_*; do
            if readelf -l "$f" | grep -q 'Requesting program interpreter'; then echo "$f is not static" >&2; exit 1; fi
          done
      - run: task release:packages VERSION="${GITHUB_REF_NAME}"
      - name: Publish packages
        # Debian, Arch Linux and Alpine registries of the owner. The job token can only read
        # packages, so a write:package token of the owner uploads. Re-runs skip files that are
        # already published with the same content.
        env:
          PACKAGES_URL: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}
          PACKAGES_USER: ${{ github.repository_owner }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: packaging/publish.sh dist/*.deb dist/*.pkg.tar.zst dist/*.apk
      - name: Publish release
        # gt (the Gitea CLI, preinstalled on the runner) uses GITEA_TOKEN and the Actions server URL.
        env:
          GITEA_TOKEN: ${{ github.token }}
          GITEA_CLI_NO_UPDATE_NOTIFIER: "1"
        run: |
          gt release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md --no-input \
            dist/deps_linux_amd64 dist/deps_linux_arm64 dist/*.deb dist/*.pkg.tar.zst dist/*.apk dist/checksums.txt
      - name: Attach the GitHub attestations
        # Gitea has no Actions OIDC, so the release is attested on the GitHub mirror, which builds the
        # same bytes. Waits (up to 30 min) for the GitHub release, verifies every bundle against
        # dist/ with cosign and uploads the bundles and SBOMs here. The release above is already
        # public, so a failure only leaves it unattested; re-run with .gitea/workflows/attest.yml.
        env:
          GITEA_TOKEN: ${{ github.token }}
          GITEA_CLI_NO_UPDATE_NOTIFIER: "1"
        run: task release:attest-from-github TAG="${GITHUB_REF_NAME}" DIR=dist
