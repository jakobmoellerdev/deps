name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: task ci
  # Release tags reuse the test job's result instead of running task ci again.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs the history and tags for the notes
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: task release:build VERSION="${GITHUB_REF_NAME}"
      - run: task release:notes
      - name: Check binaries are static
        run: |
          set -euo pipefail
          # The action runs these on arbitrary runner images: no dynamic loader allowed.
          for f in dist/deps_linux_*; do
            if readelf -l "$f" | grep -q 'Requesting program interpreter'; then echo "$f is not static" >&2; exit 1; fi
          done
      - run: task release:deb VERSION="${GITHUB_REF_NAME}"
      - name: Publish Debian packages
        # The job token can only read packages, so a write:package token of the owner uploads.
        # Re-runs skip files that are already published with the same content.
        env:
          DEB_REGISTRY: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/debian
          DEB_USER: ${{ github.repository_owner }}
          DEB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: packaging/deb/publish.sh dist/*.deb
      - name: Publish release
        # gt (the Gitea CLI, preinstalled on the runner) uses GITEA_TOKEN and the Actions server URL.
        env:
          GITEA_TOKEN: ${{ github.token }}
          GITEA_CLI_NO_UPDATE_NOTIFIER: "1"
        run: |
          gt release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md --no-input \
            dist/deps_linux_amd64 dist/deps_linux_arm64 dist/*.deb dist/checksums.txt
